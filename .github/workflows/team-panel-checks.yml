name: ARVUS panel checks
on:
  push:
    branches: [feat/arvus-team-management]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: panel-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:rules
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arvus-static-site
          path: dist/
          retention-days: 7
